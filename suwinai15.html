<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>ระบบลงชื่อเข้าเรียน ศรช.วัดศิริพงษ์ฯ</title>
    <base target="_top">
    <link rel="icon" href="https://static.wixstatic.com/media/2a7302_5c96ebeae5a54decb22fd4e2c3da8ffe~mv2.png">
    
    <style>
        /* ล้างค่า Margin/Padding ของ Body เพื่อให้ iframe แสดงผลได้เต็มหน้าจอจริง ๆ */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f5f5f5; /* ใส่สีพื้นหลังสำรองระหว่างรอโหลด */
        }

        /* ปรับแต่ง iframe ให้ตอบสนองได้ดีและลื่นไหล */
        .fullscreen-iframe {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            z-index: 999999;
            
            /* เพิ่มคุณสมบัติเรื่องความลื่นไหลในมือถือ (iOS) */
            -webkit-overflow-scrolling: touch; 
        }
    </style>
</head>
<body>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbwIHEjchxNNRSwCk0N24Tall8w4DAw9F9B9tuYT0cqV7Upg53d1Gj_D9PjNrlq0P_1BUA/exec" 
        class="fullscreen-iframe"
        allow="geolocation; microphone; camera" 
        loading="lazy">
    </iframe>

</body>
</html>
